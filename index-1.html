const M = (() => {
  const out = [], seen = new Set(); let br = "", pre = "", ser = "";
  RAW.trim().split("\n").forEach(l => {
    if (l[0] === "@") [br, pre] = l.slice(1).split("|");
    else if (l[0] === "#") ser = l.slice(1);
    else { const [sg, yr, names] = l.split("|");
      names.split(",").forEach(n => {
        const name = pre + " " + n, id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        if (!seen.has(id)) { seen.add(id); out.push([id, br, ser, name, +yr, PRICE[sg][0], PRICE[sg][1], +sg]); }
      }); }
  });
  return out;
})();

const TIER = [["First Copy / Budget LCD","Basic touch, budget friendly"],["Premium OLED / OG","In-display fingerprint works, crisp colours"],["100% Original Service Pack","OEM factory sealed, highest brightness"]];
const EXTRA = [["Battery Replacement","High-capacity cell + health calibration"],["Charging Port / Sub-Board Repair","Fast charging and Type-C fixes"],["Camera Lens Replacement","Rear lens glass or module"],["Speaker Replacement","Loud speaker or earpiece"],["Back Glass Replacement","Laser-cut, colour matched"]];

const SW = [
["frp","FRP Bypass & Pattern / PIN Recovery","Google lock, bootloader, pattern and PIN unlock with data-safety checks.",599,45,1499],
["flash","Stock ROM Re-flashing","Fixes bootloops, soft and hard bricks, dead-device recovery with official firmware.",799,90,1299],
["custom","Custom ROM Installation & Tuning","LineageOS, Pixel Experience, Magisk root, thermal tuning and debloating.",1299,150,0],

const s = {b:null, ser:"All", m:null, tab:"hw", t:-1, ex:[], sw:[], slot:"", pay:"upi"};
const swPrice = c => s.m[1] === "apple" ? c[5] : c[3];

function lines(){
  const L = [], m = s.m;
  if (s.t >= 0) L.push(["Display – " + TIER[s.t][0], m[5][s.t]]);
  s.ex.forEach(i => L.push([EXTRA[i][0], m[6][i]]));
  s.sw.forEach(code => { const c = SW.find(x => x[0] === code); L.push([c[1], swPrice(c)]); });
  return L;
}
const total = () => lines().reduce((a, l) => a + l[1], 0) + VISIT;

function opt(a, v, title, sub, price, on, dis){

function renderMatrix(){

  if (s.tab === "hw") {
    h += `<h3>Display / screen replacement</h3>` + TIER.map((t, i) => opt("tier", i, t[0], t[1], m[5][i], s.t === i)).join("");
    h += `<h3>Other repairs</h3>` + EXTRA.map((e, i) => opt("ex", i, e[0], e[1], m[6][i], s.ex.includes(i))).join("");
  } else {
    h += SW.map(c => { const p = swPrice(c), off = p === 0;
      return opt("sw", c[0], c[1], off ? "Not available for iPhone (iOS is locked to Apple firmware)." : `${c[2]} About ${c[4]} min.`, p, s.sw.includes(c[0]), off); }).join("");
  }
  h += `<p class="mut">Prices include part and labour. Your only extra charge is the ₹${VISIT} visit fee.</p>`;
  $("#matrix").innerHTML = h;
  $("#bar").hidden = false;
  const n = lines().length, rb = $("#rb");

}

  ex: v => { const i = +v; s.ex = s.ex.includes(i) ? s.ex.filter(x => x !== i) : [...s.ex, i]; renderMatrix(); },
  sw: v => { s.sw = s.sw.includes(v) ? s.sw.filter(x => x !== v) : [...s.sw, v]; renderMatrix(); },
  open: () => { if (!lines().length) return; drawerForm(); $("#dr").classList.add("show"); },
  close: () => $("#dr").classList.remove("show"),
  slot: (v, el) => { s.slot = v; document.querySelectorAll("#slots .card").forEach(c => c.classList.toggle("on", c === el)); },
  pay: (v, el) => { s.pay = v; document.querySelectorAll("#pays .card").forEach(c => c.classList.toggle("on", c === el)); },
  confirm: confirmBooking,
  payClick: () => { s.pending = s.wa; }
};
function pick(m){
  s.b = m[1]; s.m = m; s.t = -1; s.ex = []; s.sw = []; s.tab = "hw"; s.slot = "";
  $("#q").value = ""; $("#sug").hidden = true;
  renderBrands(); renderModels(); renderMatrix();
  requestAnimationFrame(() => setTimeout(() => {
    const y = $("#mx").getBoundingClientRect().top + window.scrollY - $("header").offsetHeight - 8;
    window.scrollTo({top: y, behavior: "smooth"});
  }, 60));
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (el) act[el.dataset.a](el.dataset.v, el);
  else if (!e.target.closest(".sr")) $("#sug").hidden = true;
});
$("#q").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase(), box = $("#sug");
  if (q.length < 2) { box.hidden = true; return; }
  const r = M.filter(m => m[3].toLowerCase().includes(q)).slice(0, 8);
  box.innerHTML = r.length ? r.map(m => `<button data-a="model" data-v="${m[0]}">${m[3]}<span>${BR.find(b => b[0] === m[1])[1]} · ${m[4]}</span></button>`).join("") : `<button disabled>No match yet. Pick your brand below.</button>`;
  box.hidden = false;
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !s.pending) return;
  const w = s.pending; s.pending = null;
  setTimeout(() => { if (window.top === window) location.href = w; else window.open(w, "_blank"); }, 400);
});
renderBrands();
</script>
